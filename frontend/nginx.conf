# Só o documento institucional pode carregar os scripts opcionais dos fornecedores.
map $request_uri $optional_tracking_scripts {
  default "";
  /sobre "https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms";
}

server {
  # O domínio público da Railway aponta para a porta interna 80.
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # O navegador recebe estas barreiras em todas as respostas, inclusive erros.
  # A política permite Supabase, API e Clarity por HTTPS, mas bloqueia scripts,
  # frames e objetos vindos de origens não previstas.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' $optional_tracking_scripts https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  # A configuração pública é gerada ao iniciar o container, não no Git.
  location = /runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # O React controla as rotas depois que o Nginx entrega a página inicial.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
