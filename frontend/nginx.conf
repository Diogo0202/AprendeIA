server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A configuração pública é gerada ao iniciar o container, não no Git.
  location = /runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # O React controla as rotas depois que o Nginx entrega a página inicial.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
