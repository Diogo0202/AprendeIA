name: Qualidade e deploy

on:
  pull_request:
  push:
    branches: [main, entrega-2809]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt bandit
      - run: python -m unittest discover backend -v
      - run: bandit -q -r backend -x backend/.venv,backend/test_*.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --test scripts/monitor-production.test.mjs
      - run: node --test scripts/trigger-weekly-summary.test.mjs

  privacy-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/validation/package-lock.json
      - run: npm ci
        working-directory: scripts/validation
      - run: npm test
        working-directory: scripts/validation

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, privacy-database]
    steps:
      - name: Acionar Railway somente quando os hooks existirem
        env:
          RAILWAY_BACKEND_DEPLOY_HOOK: ${{ secrets.RAILWAY_BACKEND_DEPLOY_HOOK }}
          RAILWAY_FRONTEND_DEPLOY_HOOK: ${{ secrets.RAILWAY_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$RAILWAY_BACKEND_DEPLOY_HOOK" ]; then curl --fail --silent --show-error --request POST "$RAILWAY_BACKEND_DEPLOY_HOOK"; else echo "Hook do backend não configurado."; fi
          if [ -n "$RAILWAY_FRONTEND_DEPLOY_HOOK" ]; then curl --fail --silent --show-error --request POST "$RAILWAY_FRONTEND_DEPLOY_HOOK"; else echo "Hook do frontend não configurado."; fi
