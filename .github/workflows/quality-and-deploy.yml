name: Qualidade e deploy

on:
  pull_request:
    branches: [main, entrega-2809, entrega1109]
  push:
    branches: [main, entrega-2809, entrega1109]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt bandit
      - run: python -m unittest discover backend -v
      - run: bandit -q -r backend -x backend/.venv,backend/test_*.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --test scripts/monitor-production.test.mjs
      - run: node --test scripts/trigger-weekly-summary.test.mjs
      - run: node --test scripts/verify-deployment.test.mjs

  privacy-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/validation/package-lock.json
      - run: npm ci
        working-directory: scripts/validation
      - run: npm test
        working-directory: scripts/validation

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  pr-checks:
    if: always()
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, privacy-database]
    steps:
      - name: Exigir sucesso dos checks da PR
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          E2E: ${{ needs.e2e.result }}
          PRIVACY_DATABASE: ${{ needs.privacy-database.result }}
        run: |
          test "$BACKEND" = success
          test "$FRONTEND" = success
          test "$E2E" = success
          test "$PRIVACY_DATABASE" = success

  deploy:
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: pr-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar verificador sem chamadas externas
        run: node --test scripts/verify-deployment.test.mjs
      - name: Conferir deploy terminal do SHA em Vercel e Railway
        env:
          EXPECTED_SHA: ${{ github.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PRODUCTION_DOMAIN: ${{ vars.VERCEL_PRODUCTION_DOMAIN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          DEPLOYMENT_WAIT_MS: "900000"
        run: node scripts/verify-deployment.mjs
